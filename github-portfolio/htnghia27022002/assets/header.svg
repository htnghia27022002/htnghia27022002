<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 200" width="860" height="200" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#1b1446"/>
    </linearGradient>
    <linearGradient id="name" x1="0" x2="1">
      <stop offset="0" stop-color="#818cf8"/>
      <stop offset="0.5" stop-color="#c084fc"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <filter id="blur" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="30"/></filter>
    <clipPath id="card"><rect width="860" height="200" rx="18"/></clipPath>
  </defs>

  <g clip-path="url(#card)">
    <rect width="860" height="200" fill="url(#bg)"/>
    <circle cx="120" cy="40" r="90" fill="#6366f1" opacity="0.35" filter="url(#blur)">
      <animate attributeName="cx" values="120;220;120" dur="12s" repeatCount="indefinite"/>
    </circle>
    <circle cx="760" cy="170" r="100" fill="#06b6d4" opacity="0.3" filter="url(#blur)">
      <animate attributeName="cx" values="760;640;760" dur="14s" repeatCount="indefinite"/>
    </circle>
    <circle cx="480" cy="-10" r="70" fill="#c084fc" opacity="0.25" filter="url(#blur)">
      <animate attributeName="cy" values="-10;40;-10" dur="10s" repeatCount="indefinite"/>
    </circle>
  </g>

  <text x="430" y="82" text-anchor="middle" font-size="42" font-weight="800" letter-spacing="2" fill="url(#name)">HUYNH TRONG NGHIA</text>

  <g font-size="18" fill="#e6e9f5" text-anchor="middle">
    <text x="430" y="126" opacity="0">Backend Engineer · Go / PHP
      <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.02;0.23;0.25;1" dur="12s" repeatCount="indefinite"/>
    </text>
    <text x="430" y="126" opacity="0">Distributed &amp; real-time systems
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.25;0.27;0.48;0.5;1" dur="12s" repeatCount="indefinite"/>
    </text>
    <text x="430" y="126" opacity="0">Temporal · Kafka · NATS · ClickHouse
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.5;0.52;0.73;0.75;1" dur="12s" repeatCount="indefinite"/>
    </text>
    <text x="430" y="126" opacity="0">AI-augmented development · LLM integration
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.75;0.77;0.98;1" dur="12s" repeatCount="indefinite"/>
    </text>
  </g>

  <g font-size="12" fill="#94a0c6" text-anchor="middle">
    <text x="430" y="166">Ho Chi Minh City, Vietnam  ·  3.5+ years  ·  Open to Backend / Platform roles</text>
  </g>
</svg>
