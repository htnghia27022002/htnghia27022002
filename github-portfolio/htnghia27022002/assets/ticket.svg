<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 380" width="860" height="380" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#2a1236"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="860" height="380" rx="18" fill="url(#bg)"/>
  <text x="32" y="44" font-size="20" font-weight="700" fill="#e6e9f5">Ticketing &amp; Booking · Zero double-booking at peak</text>
  <text x="32" y="68" font-size="13" fill="#94a0c6">Redis distributed lock · Caching · Message queue · High-availability APIs</text>
  <text x="32" y="106" font-size="11" font-weight="600" fill="#fb7185" letter-spacing="1.5">2 USERS · SAME SEAT · SAME MILLISECOND</text>

  <!-- wires -->
  <g fill="none" stroke="#2b3560" stroke-width="2">
    <path d="M104,140 C170,140 190,200 230,200"/>
    <path d="M104,290 C170,290 190,214 230,214"/>
    <path d="M350,206 L410,206"/>
    <path d="M520,200 C560,200 600,199 640,199"/>
  </g>

  <!-- users -->
  <g font-weight="800" text-anchor="middle">
    <circle cx="80" cy="140" r="24" fill="#22d3ee"/>
    <text x="80" y="146" font-size="16" fill="#0b1020">A</text>
    <circle cx="80" cy="290" r="24" fill="#c084fc"/>
    <text x="80" y="296" font-size="16" fill="#0b1020">B</text>
  </g>

  <!-- API + lock -->
  <g font-size="13" font-weight="700" fill="#e6e9f5" text-anchor="middle">
    <rect x="230" y="180" width="120" height="52" rx="12" fill="#121a33" stroke="#818cf8" stroke-opacity="0.7" stroke-width="1.5"/>
    <text x="290" y="203">Booking API</text>
    <text x="290" y="220" font-size="10" font-weight="400" fill="#94a0c6">Go · cached reads</text>

    <rect x="410" y="180" width="110" height="52" rx="12" fill="#121a33" stroke="#2b3560" stroke-width="1.5">
      <animate attributeName="stroke" values="#2b3560;#2b3560;#fbbf24;#fbbf24;#2b3560;#2b3560" keyTimes="0;0.28;0.29;0.55;0.57;1" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="fill" values="#121a33;#121a33;#3a2e10;#3a2e10;#121a33;#121a33" keyTimes="0;0.28;0.29;0.55;0.57;1" dur="6s" repeatCount="indefinite"/>
    </rect>
    <text x="465" y="203">Redis lock</text>
    <text x="465" y="220" font-size="10" font-weight="400" fill="#94a0c6">SET seat:C3 NX PX</text>
  </g>
  <text x="465" y="252" text-anchor="middle" font-size="11" font-weight="600" fill="#fbbf24" opacity="0">🔒 held by A
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.28;0.29;0.55;0.57;1" dur="6s" repeatCount="indefinite"/>
  </text>

  <!-- seats -->
  <text x="610" y="106" font-size="11" font-weight="600" fill="#94a0c6" letter-spacing="1.5">SEAT MAP</text>
  <g fill="#1e2748">
    <rect x="610" y="118" width="26" height="26" rx="6" fill="#4c1d95"/><rect x="644" y="118" width="26" height="26" rx="6"/><rect x="678" y="118" width="26" height="26" rx="6" fill="#4c1d95"/><rect x="712" y="118" width="26" height="26" rx="6" fill="#4c1d95"/><rect x="746" y="118" width="26" height="26" rx="6"/><rect x="780" y="118" width="26" height="26" rx="6"/>
    <rect x="610" y="152" width="26" height="26" rx="6"/><rect x="644" y="152" width="26" height="26" rx="6" fill="#4c1d95"/><rect x="678" y="152" width="26" height="26" rx="6"/><rect x="712" y="152" width="26" height="26" rx="6"/><rect x="746" y="152" width="26" height="26" rx="6" fill="#4c1d95"/><rect x="780" y="152" width="26" height="26" rx="6"/>
    <rect x="610" y="186" width="26" height="26" rx="6"/><rect x="644" y="186" width="26" height="26" rx="6" fill="#4c1d95"/>
    <rect x="678" y="186" width="26" height="26" rx="6" stroke="#fbbf24" stroke-width="2">
      <animate attributeName="fill" values="#1e2748;#1e2748;#34d399;#34d399;#1e2748" keyTimes="0;0.45;0.47;0.95;1" dur="6s" repeatCount="indefinite"/>
    </rect>
    <rect x="712" y="186" width="26" height="26" rx="6"/><rect x="746" y="186" width="26" height="26" rx="6"/><rect x="780" y="186" width="26" height="26" rx="6" fill="#4c1d95"/>
    <rect x="610" y="220" width="26" height="26" rx="6" fill="#4c1d95"/><rect x="644" y="220" width="26" height="26" rx="6"/><rect x="678" y="220" width="26" height="26" rx="6"/><rect x="712" y="220" width="26" height="26" rx="6" fill="#4c1d95"/><rect x="746" y="220" width="26" height="26" rx="6"/><rect x="780" y="220" width="26" height="26" rx="6"/>
    <rect x="610" y="254" width="26" height="26" rx="6"/><rect x="644" y="254" width="26" height="26" rx="6"/><rect x="678" y="254" width="26" height="26" rx="6" fill="#4c1d95"/><rect x="712" y="254" width="26" height="26" rx="6"/><rect x="746" y="254" width="26" height="26" rx="6" fill="#4c1d95"/><rect x="780" y="254" width="26" height="26" rx="6" fill="#4c1d95"/>
  </g>
  <text x="691" y="203" text-anchor="middle" font-size="9" font-weight="700" fill="#e6e9f5">C3</text>

  <!-- packets -->
  <g filter="url(#glow)">
    <circle r="7" fill="#22d3ee">
      <animateMotion path="M104,140 C170,140 190,200 230,200 L520,200 C560,200 600,199 691,199" dur="6s" repeatCount="indefinite" calcMode="linear" keyPoints="0;1;1" keyTimes="0;0.45;1"/>
      <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.45;0.47;1" dur="6s" repeatCount="indefinite"/>
    </circle>
    <circle r="7" fill="#c084fc">
      <animateMotion path="M104,290 C170,290 190,214 230,214 L410,214 L230,214 C190,214 170,290 104,290" dur="6s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0.5;0.5;1;1" keyTimes="0;0.36;0.42;0.72;1"/>
      <animate attributeName="fill" values="#c084fc;#c084fc;#fb7185;#fb7185;#c084fc" keyTimes="0;0.4;0.42;0.95;1" dur="6s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- outcomes -->
  <g font-size="12" font-weight="600">
    <text x="610" y="306" fill="#34d399" opacity="0">✓ User A booked seat C3
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.46;0.48;0.95;1" dur="6s" repeatCount="indefinite"/>
    </text>
    <text x="40" y="336" fill="#fb7185" opacity="0">✕ User B: “Seat C3 just taken, pick another”
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.7;0.72;0.95;1" dur="6s" repeatCount="indefinite"/>
    </text>
  </g>

  <text x="32" y="364" font-size="12" fill="#94a0c6">● Only one request can hold a seat lock   ● Cache absorbs peak-season reads   ● Queue smooths write bursts</text>
</svg>
